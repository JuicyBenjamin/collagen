name: ci

# Pull requests only. A push to main is a pull request that already passed
# here (rebase merges land each commit as it was checked), so checking it
# again only adds a run. The release PR is skipped: it only bumps versions
# and changelogs, and the publish job runs typecheck and tests before it
# ships — waiting on a full run there only holds the release up. A skipped
# job counts as passed for the branch's required checks.
on:
  pull_request:

jobs:
  check:
    if: github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @collagen/cli build
      # the published artifact must start: version banner through the bin shim
      - run: node apps/cli/bin/collagen.js --version
      # …and it must start the way a USER gets it: the packed tarball, installed
      # by npm into a clean prefix with no lockfile — the workspace's pinned
      # node_modules hide what a caret range lets npm pick (an @effect peer and a
      # 0.x callscript both shipped broken this way)
      - name: install the tarball like a user and run it
        run: |
          set -eu
          pnpm --filter @collagen/cli pack --pack-destination "$RUNNER_TEMP"
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/collagen-cli-*.tgz
          node "$RUNNER_TEMP/prefix/lib/node_modules/@collagen/cli/bin/collagen.js" --version
