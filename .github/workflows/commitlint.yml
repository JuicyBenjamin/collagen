name: commitlint

# Every commit on a PR must be a conventional commit: with rebase merges each
# one lands on main as-is and becomes a line in the release notes.
on:
  pull_request:

jobs:
  commits:
    # the release PR's one commit is release-please's own: nothing to lint,
    # and its merge should not wait on it
    if: github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
